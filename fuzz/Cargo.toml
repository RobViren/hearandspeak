[package]
name = "hearandspeak-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hearandspeak = { path = ".." }

[[bin]]
name = "g2p"
path = "fuzz_targets/g2p.rs"
