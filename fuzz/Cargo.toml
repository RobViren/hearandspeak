doc = false
bench = false

[[bin]]
name = "resample"
path = "fuzz_targets/resample.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asr_stream"
path = "fuzz_targets/asr_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tts_synth"
path = "fuzz_targets/tts_synth.rs"
test = false
doc = false
bench = false
